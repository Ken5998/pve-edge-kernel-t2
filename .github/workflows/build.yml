name: Kernel Build

on:
  push:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:17 UTC (04:17/05:17 Europe/Zurich).
    - cron: '17 3 * * 1'

concurrency:
  group: kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci') }}

    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v7

      - name: Prepare current sources and release metadata
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/t2linux/linux-t2-patches.git
          rm -f linux-t2-patches/2008-i915-4-lane-quirk-for-mbp15-1.patch

          git clone --depth 1 git://git.proxmox.com/git/pve-kernel.git

          kernel_major=$(sed -n 's/^KERNEL_MAJ=//p' pve-kernel/Makefile)
          kernel_minor=$(sed -n 's/^KERNEL_MIN=//p' pve-kernel/Makefile)
          kernel_patch=$(sed -n 's/^KERNEL_PATCHLEVEL=//p' pve-kernel/Makefile)
          kernel_release=$(sed -n 's/^KREL=//p' pve-kernel/Makefile)
          kernel_release_extra=$(sed -n 's/^KREL_EXTRA=//p' pve-kernel/Makefile)
          release_tag="v${kernel_major}.${kernel_minor}.${kernel_patch}-${kernel_release}${kernel_release_extra}-t2-1"

          should_build=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            should_build=false
            echo "${release_tag} already exists; the scheduled build is not needed."
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"
          echo "pve_commit=$(git -C pve-kernel rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "t2_commit=$(git -C linux-t2-patches rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Verify APT publishing credentials
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for required_variable in \
            R2_ACCOUNT_ID \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            APT_GPG_PRIVATE_KEY \
            APT_GPG_PASSPHRASE; do
            test -n "${!required_variable}"
          done
          AWS_DEFAULT_REGION=auto aws s3 ls \
            s3://pve-t2-apt \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Free up disk space for the CI
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        uses: Ken5998/remove-unwanted-software@v1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'

      - name: Build Kernel
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        run: |
          echo "APT::Get::Assume-Yes \"true\";" > ./90forceyes

          apt list --installed | cut -d "/" -f 1 | grep python | xargs > ./python-pkg
          for missing in python3-apport python3-commandnotfound python3-distupgrade python3-problem-report python3-update-manager python3.10-venv
          do
            sed -i -e "s/\<${missing}\>//g" ./python-pkg
          done

          DOCKER_IMAGE=debian:trixie
          docker pull ${DOCKER_IMAGE}
          docker run \
            --privileged \
            -t \
            -v "$(pwd)":/repo \
            ${DOCKER_IMAGE} \
            /bin/bash -c 'cd /repo && \
              cp ./90forceyes /etc/apt/apt.conf.d/90forceyes && \
              apt update && apt install wget && \
              echo "Types: deb" > /etc/apt/sources.list.d/pve-install-repo.sources && \
              echo "URIs: http://download.proxmox.com/debian/pve" >> /etc/apt/sources.list.d/pve-install-repo.sources && \
              echo "Suites: trixie" >> /etc/apt/sources.list.d/pve-install-repo.sources && \
              echo "Components: pve-no-subscription" >> /etc/apt/sources.list.d/pve-install-repo.sources && \
              echo "Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg" >> /etc/apt/sources.list.d/pve-install-repo.sources && \
              wget https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg -O /usr/share/keyrings/proxmox-archive-keyring.gpg && \
              apt modernize-sources && apt update && apt install asciidoc-base automake bc bison cpio debhelper dh-python file flex \
                gcc git kmod libdw-dev libelf-dev libiberty-dev libnuma-dev libslang2-dev libssl-dev libtool lintian lz4 dwarves libpve-common-perl python3-dev zstd \
                perl-modules rsync sed sphinx-common tar xmlto zlib1g-dev gawk \
                bindgen rustc rust-src rustfmt rust-clippy && \
              git config --global --add safe.directory "*" && \
              cd pve-kernel && \
              cp ../linux-t2-patches/*patch ./patches/kernel && \
              cp ../T2.patch ./ && \
              git config --global user.email "example@example.com" && \
              git config --global user.name "Example Example" && \
              git am T2.patch && \
              KERNEL_SRC_SUBMODULE=submodules/ubuntu-kernel && \
              ZFSONLINUX_SUBMODULE=submodules/zfsonlinux && \
              git submodule update --depth 1 --init ${KERNEL_SRC_SUBMODULE} && \
              git submodule update --init --recursive ${ZFSONLINUX_SUBMODULE} && \
              make deb && \
              ls -l'

      - name: Upload Artifacts
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: ${{ github.workspace }}/pve-kernel/*.deb

      - name: Release
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/pve-kernel/*.deb
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          body: |
            Kernel PVE con patch T2 per Mac con chip T2.

            Patch T2 commit: `${{ steps.prepare.outputs.t2_commit }}`
            Base Proxmox commit: `${{ steps.prepare.outputs.pve_commit }}`

            Per installare:
            ```
            apt install ./proxmox-kernel-*t2*.deb
            ```

            Riferimenti utili:
            - https://wiki.t2linux.org/
            - https://wiki.t2linux.org/guides/fan/
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APT repository
        if: ${{ steps.prepare.outputs.should_build == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: pve-t2-apt
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils gnupg
          aws --version
          bash ./scripts/publish-apt-repository.sh "${{ github.workspace }}/pve-kernel"
